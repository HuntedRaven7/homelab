# SOPS Configuration for Homelab
# This file tells SOPS which keys to use for which files

creation_rules:
  # Encrypt all .yaml files in .sops/ with age
  # Encrypt all string values (not just data/stringData)
  - path_regex: \.sops/.*\.yaml$
    age: "age1e45ke8t9tc9ke0u8ajk2cfnjv4xxh6q3569077q8smpku8gwxusqcpawul"
    encrypted_regex: "^(data|stringData|tailnet_domain)$"

  # Encrypt specific secret files in manifests
  - path_regex: k0s/manifests/apps/.*\.yaml$
    age: "age1e45ke8t9tc9ke0u8ajk2cfnjv4xxh6q3569077q8smpku8gwxusqcpawul"
    encrypted_regex: "^(data|stringData)$"

  # Encrypt all secret files
  - path_regex: .*secret.*\.yaml$
    age: "age1e45ke8t9tc9ke0u8ajk2cfnjv4xxh6q3569077q8smpku8gwxusqcpawul"
    encrypted_regex: "^(data|stringData)$"

