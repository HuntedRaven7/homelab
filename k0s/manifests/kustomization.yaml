#   - name: ntfy-secrets
#     behavior: merge
#     envs:
#       - ntfy-secrets.env
#   - name: karakeep-secrets
#     behavior: merge
#     envs:
#       - karakeep-secrets.env
#   - name: searxng-secrets
#     behavior: merge
#     envs:
#       - searxng-secrets.env

# Patches for environment-specific overrides
patches:
  # Example: Override replicas for production
  # - patch: |-
  #     apiVersion: apps/v1
  #     kind: Deployment
  #     metadata:
  #       name: vaultwarden
  #       namespace: homelab
  #     spec:
  #       replicas: 2
  #   target:
  #     kind: Deployment
  #     labelSelector: app=vaultwarden

# Replacements for cross-references
replacements:
  - source:
      kind: Service
      name: traefik
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: IngressRoute
          labelSelector: traefik.io/ingress-class=traefik
        fieldPaths:
          - spec.routes[0].services[0].namespace
  # Replace TAILNET_DOMAIN placeholder in IngressRoute host rules
  - source:
      kind: ConfigMap
      name: tailnet-config
      fieldPath: data.TAILNET_DOMAIN
    targets:
      - select:
          kind: IngressRoute
        fieldPaths:
          - spec.routes[0].match
      options:
        delimiter: ""
        regex: 'Host\(`([^`]+)`\)'
        replace: 'Host(`$1.TAILNET_DOMAIN`)'