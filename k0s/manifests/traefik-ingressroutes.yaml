---
# IngressRoutes for Homelab Services
# These route traffic from Traefik to the services
# Services run in k0s cluster, accessed via Tailscale MagicDNS
# TAILNET_DOMAIN placeholder is replaced at deploy time from SOPS encrypted file

---
# Hermes Agent IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent
  namespace: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.${TAILNET_DOMAIN}`)
      kind: Rule
      services:
        - name: hermes-agent
          port: 8000
          kind: Service
      middlewares:
        - name: security-headers
          namespace: kube-system
---
