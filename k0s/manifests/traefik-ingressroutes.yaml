---
# IngressRoutes for Homelab Services
# These route traffic from Traefik to the services
# Services run in k0s cluster, accessed via Tailscale MagicDNS
# TAILNET_DOMAIN placeholder is replaced at deploy time from SOPS encrypted file

---
# Tailscale ExternalName Service (for accessing tailscale from cluster)
apiVersion: v1
kind: Service
metadata:
  name: tailscale
  namespace: homelab
spec:
  type: ExternalName
  externalName: tailscale.${TAILNET_DOMAIN}
  ports:
    - port: 80
      targetPort: 80
---
# Hermes Agent IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent
  namespace: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.${TAILNET_DOMAIN}`)
      kind: Rule
      services:
        - name: hermes-agent
          port: 8000
          kind: Service
      middlewares:
        - name: security-headers
          namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: homelab
  labels:
    app: hermes-agent
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: hermes-agent
---
# Vaultwarden IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vault.${TAILNET_DOMAIN}`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
          kind: Service
      middlewares:
        - name: security-headers
          namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: homelab
  labels:
    app: vaultwarden
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 3012
      targetPort: 3012
      name: websocket
  selector:
    app: vaultwarden
---
# Ntfy IngressRoute
apiVersion: traefik.io/v1alpha1
