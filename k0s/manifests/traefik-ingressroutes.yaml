      middlewares:
        - name: security-headers
          namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: homelab
  labels:
    app: ntfy
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 8081
      targetPort: 8081
      name: manager
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: ntfy
