---
# IngressRoutes for Homelab Services
# These route traffic from Traefik to the services
# Services run on Tailscale network, so we use ExternalName services or direct IPs

---
# Tailscale ExternalName Service (for accessing tailscale from cluster)
apiVersion: v1
kind: Service
metadata:
  name: tailscale
  namespace: default
spec:
  type: ExternalName
  externalName: tailscale.tailnet.ts.net
  ports:
    - port: 80
      targetPort: 80
---
# Hermes Agent IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.tailnet.ts.net`)
      kind: Rule
      services:
        - name: hermes-agent
          port: 8000
          kind: Service
      middlewares:
        - name: security-headers
          namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: default
spec:
  type: ExternalName
  externalName: hermes-agent.tailnet.ts.net
  ports:
    - port: 8000
      targetPort: 8000
---
