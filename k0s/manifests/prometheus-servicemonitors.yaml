---
# ServiceMonitors for Homelab Services (k0s native)
# These allow Prometheus (running in k0s) to scrape metrics from services in homelab namespace

---
# Traefik ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: traefik
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Hermes Agent ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hermes-agent
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: hermes-agent
  namespaceSelector:
    matchNames:
      - homelab
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
