---
# ServiceMonitors for Homelab Services
# These allow Prometheus (running in k0s) to scrape metrics from services on Tailscale

---
# Traefik ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: traefik
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Hermes Agent ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hermes-agent
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: hermes-agent
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: default
  labels:
    app: hermes-agent
spec:
  type: ExternalName
  externalName: hermes-agent.tailnet.ts.net
  ports:
    - name: http
      port: 8000
      targetPort: 8000
