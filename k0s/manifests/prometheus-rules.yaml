---
# PrometheusRules for Homelab Alerting
# Alerts for service health, resource usage, etc.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-services
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: homelab.service.health
      interval: 30s
      rules:
        - alert: ServiceDown
          expr: |
            up{job=~"hermes-agent|vaultwarden|ntfy|glance|karakeep|searxng|tailscale|traefik"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "{{ $labels.job }} has been down for more than 2 minutes"
            runbook_url: "https://github.com/yourusername/homelab/blob/main/docs/runbooks/service-down.md"

        - alert: ServiceHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~"hermes-agent|vaultwarden|ntfy|glance|karakeep|searxng|traefik"}[5m])) by (le, job)) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency on {{ $labels.job }}"
            description: "95th percentile latency on {{ $labels.job }} is above 5 seconds"

        - alert: ServiceHighErrorRate
          expr: |
            sum(rate(http_requests_total{job=~"hermes-agent|vaultwarden|ntfy|glance|karakeep|searxng|traefik",status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total{job=~"hermes-agent|vaultwarden|ntfy|glance|karakeep|searxng|traefik"}[5m])) by (job)
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on {{ $labels.job }}"
            description: "Error rate on {{ $labels.job }} is above 5%"

    - name: homelab.resource.usage
      interval: 30s
      rules:
        - alert: ContainerHighMemoryUsage
          expr: |
            (container_memory_usage_bytes{container!="POD",namespace=~"homelab|kube-system|monitoring"} / container_spec_memory_limit_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage for {{ $labels.container }}"
            description: "{{ $labels.container }} in {{ $labels.namespace }} is using >85% of memory limit"

        - alert: ContainerHighCPUUsage
          expr: |
            (sum(rate(container_cpu_usage_seconds_total{container!="POD",namespace=~"homelab|kube-system|monitoring"}[5m])) by (container, namespace) / sum(container_spec_cpu_quota{container!="POD",namespace=~"homelab|kube-system|monitoring"} / container_spec_cpu_period{container!="POD",namespace=~"homelab|kube-system|monitoring"}) by (container, namespace)) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage for {{ $labels.container }}"
            description: "{{ $labels.container }} in {{ $labels.namespace }} is using >85% of CPU limit"

        - alert: NodeHighMemoryUsage
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on node {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} is using >85% of available memory"

        - alert: NodeHighCPUUsage
          expr: |
            (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on node {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} is using >85% of CPU"

        - alert: NodeDiskUsage
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Low disk space on {{ $labels.instance }}"
            description: "Root filesystem on {{ $labels.instance }} has less than 15% free space"

    - name: homelab.tailscale
      interval: 60s
      rules:
        - alert: TailscalePeerDisconnected
          expr: |
            tailscale_peer_connected == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tailscale peer {{ $labels.peer }} disconnected"
            description: "Tailscale peer {{ $labels.peer }} has been disconnected for 5 minutes"

        - alert: TailscaleHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(tailscale_peer_latency_seconds_bucket[5m])) by (le, peer)) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Tailscale latency to {{ $labels.peer }}"
            description: "95th percentile latency to {{ $labels.peer }} is above 1 second"

    - name: homelab.kubernetes
      interval: 30s
      rules:
        - alert: K0sNodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "K0s node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been NotReady for 5 minutes"

        - alert: K0sPodNotRunning
          expr: |
            kube_pod_status_phase{phase=~"Failed|Pending|Unknown",namespace=~"homelab|kube-system|monitoring"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is not running"
            description: "Pod {{ $labels.pod }} has been in {{ $labels.phase }} state for 5 minutes"

        - alert: K0sDeploymentReplicasMismatch
          expr: |
            kube_deployment_status_replicas_available{namespace=~"homelab|kube-system|monitoring"} != kube_deployment_spec_replicas{namespace=~"homelab|kube-system|monitoring"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} replicas mismatch"
            description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has fewer available replicas than desired"