---
# SearXNG - Privacy-Friendly Search Engine
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secrets
  namespace: homelab
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  SEARXNG_SECRET_KEY: ""
  # Optional: Redis URL
  # SEARXNG_REDIS_URL: "redis://redis:6379/0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: homelab
data:
  settings.yml: |
    general:
      debug: false
      instance_name: "Homelab Search"
      contact_url: "mailto:admin@tailnet.ts.net"
      enable_metrics: true

    server:
      base_url: https://search.tailnet.ts.net/
      secret_key: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_32"
      limiter: false
      redis:
        url: redis://redis:6379/0

    ui:
      static_use_hash: true
      default_locale: "en"
      theme: "simple"

    search:
      safe_search: 1
      autocomplete: "google"
      formats:
        - html
        - json
      engines:
        - name: google
          engine: google
          shortcut: g
          tokens: [g]
        - name: duckduckgo
          engine: duckduckgo
          shortcut: d
          tokens: [d]
        - name: bing
          engine: bing
          shortcut: b
          tokens: [b]
        - name: brave
          engine: brave
          shortcut: br
          tokens: [br]
        - name: wikipedia
          engine: wikipedia
          shortcut: w
          tokens: [w]
        - name: github
          engine: github
          shortcut: gh
          tokens: [gh]
        - name: reddit
          engine: reddit
          shortcut: r
          tokens: [r]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: homelab
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest@sha256:a93b665d10ce0675e8d2124187943111399ba69f384228c51b4cd21fdceda0bc
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SEARXNG_BASE_URL
              value: "https://search.tailnet.ts.net/"
            - name: SEARXNG_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: SEARXNG_SECRET_KEY
            - name: SEARXNG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: SEARXNG_REDIS_URL
                  optional: true
            - name: SEARXNG_LIMITER
              value: "false"
          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: homelab
  labels:
    app: searxng
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: searxng
