apiVersion: k0s.k0sproject.io/v1beta1
kind: ClusterConfig
metadata:
  name: homelab
spec:
  api:
    address: 0.0.0.0
    port: 6443
    extraArgs:
      enable-admission-plugins: "NodeRestriction,PodSecurityPolicy"
      audit-log-path: "/var/log/kubernetes/audit.log"
  network:
    provider: calico
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    dualStack: false
  storage:
    type: local
    localPath:
      path: /var/lib/k0s/volumes
  controllers:
    replicas: 1
  workerProfiles:
    - name: default
      labels:
        k0s.io/node-role: worker
      taints: []
  telemetry:
    enabled: false
  images:
    defaultRegistry: docker.io
  extensions:
    helm:
      repositories:
        - name: traefik
          url: https://traefik.github.io/charts
        - name: prometheus-community
          url: https://prometheus-community.github.io/helm-charts
        - name: jetstack
          url: https://charts.jetstack.io
      charts:
        - name: traefik/traefik
          version: "30.0.0"
          namespace: kube-system
          values: |
            deployment:
              kind: DaemonSet
            ports:
              web:
                port: 80
                hostPort: 80
              websecure:
                port: 443
                hostPort: 443
            service:
              enabled: false
            providers:
              kubernetesCRD:
                enabled: true
              kubernetesIngress:
                enabled: true
            ingressRoute:
              dashboard:
                enabled: true
            logs:
              general:
                level: INFO
            metrics:
              prometheus:
                enabled: true
        - name: prometheus-community/kube-prometheus-stack
          version: "65.0.0"
          namespace: monitoring
          createNamespace: true
          values: |
            prometheus:
              prometheusSpec:
                retention: 15d
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      storageClassName: local-path
                      resources:
                        requests:
                          storage: 10Gi
                serviceMonitorSelectorNilUsesHelmValues: false
                podMonitorSelectorNilUsesHelmValues: false
            grafana:
              enabled: true
              adminPassword: "changeme"
              persistence:
                enabled: true
                size: 2Gi
              sidecar:
                dashboards:
                  enabled: true
                datasources:
                  enabled: true
            alertmanager:
              enabled: true
              alertmanagerSpec:
                storage:
                  volumeClaimTemplate:
                    spec:
                      storageClassName: local-path
                      resources:
                        requests:
                          storage: 2Gi