# Prometheus Configuration
# Place in /etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'tailscale'
    static_configs:
      - targets: ['tailscale:9091']

  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'hermes-agent'
    static_configs:
      - targets: ['hermes-agent:8000']

  - job_name: 'vaultwarden'
    static_configs:
      - targets: ['vaultwarden:80']

  - job_name: 'ntfy'
    static_configs:
      - targets: ['ntfy:80']

  - job_name: 'glance'
    static_configs:
      - targets: ['glance:8080']

  - job_name: 'karakeep'
    static_configs:
      - targets: ['karakeep:3000']

  - job_name: 'searxng'
    static_configs:
      - targets: ['searxng:8080']