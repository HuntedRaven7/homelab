# Traefik Dynamic Configuration
# Place in /etc/traefik/dynamic.yml

http:
  routers:
    hermes-agent:
      rule: "Host(`hermes.tailnet.ts.net`)"
      service: hermes-agent
      tls: {}
    vaultwarden:
      rule: "Host(`vault.tailnet.ts.net`)"
      service: vaultwarden
      tls: {}
    ntfy:
      rule: "Host(`ntfy.tailnet.ts.net`)"
      service: ntfy
      tls: {}
    glance:
      rule: "Host(`glance.tailnet.ts.net`)"
      service: glance
      tls: {}
    karakeep:
      rule: "Host(`karakeep.tailnet.ts.net`)"
      service: karakeep
      tls: {}
    searxng:
      rule: "Host(`search.tailnet.ts.net`)"
      service: searxng
      tls: {}
    prometheus:
      rule: "Host(`prometheus.tailnet.ts.net`)"
      service: prometheus
      tls: {}

  services:
    hermes-agent:
      loadBalancer:
        servers:
          - url: "http://hermes-agent:8000"
    vaultwarden:
      loadBalancer:
        servers:
          - url: "http://vaultwarden:80"
    ntfy:
      loadBalancer:
        servers:
          - url: "http://ntfy:80"
    glance:
      loadBalancer:
        servers:
          - url: "http://glance:8080"
    karakeep:
      loadBalancer:
        servers:
          - url: "http://karakeep:3000"
    searxng:
      loadBalancer:
        servers:
          - url: "http://searxng:8080"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"