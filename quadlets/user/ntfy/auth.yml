# Ntfy Authentication Configuration
# Place in /etc/ntfy/auth.yml
# Generate passwords with: ntfy hash "your-password"

# Example:
# users:
#   "admin":
#     password: "$2a$10$..."
#     roles: ["admin"]
#   "user":
#     password: "$2a$10$..."
#     roles: ["user"]

# For now, allow unauthenticated access (configure via NTFY_AUTH_DEFAULT_ACCESS)