# SearXNG Settings
# Place in /etc/searxng/settings.yml

general:
  debug: false
  instance_name: "Homelab Search"
  contact_url: "mailto:admin@tailnet.ts.net"
  enable_metrics: true

server:
  base_url: https://search.tailnet.ts.net/
  secret_key: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_32"
  limiter: false
  redis:
    url: redis://redis:6379/0

ui:
  static_use_hash: true
  default_locale: "en"
  theme: "simple"

search:
  safe_search: 1
  autocomplete: "google"
  formats:
    - html
    - json
  engines:
    - name: google
      engine: google
      shortcut: g
      tokens: [g]
    - name: duckduckgo
      engine: duckduckgo
      shortcut: d
      tokens: [d]
    - name: bing
      engine: bing
      shortcut: b
      tokens: [b]
    - name: brave
      engine: brave
      shortcut: br
      tokens: [br]
    - name: wikipedia
      engine: wikipedia
      shortcut: w
      tokens: [w]
    - name: github
      engine: github
      shortcut: gh
      tokens: [gh]
    - name: reddit
      engine: reddit
      shortcut: r
      tokens: [r]